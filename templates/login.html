<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Peluqueria Mary</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='src/styles.css') }}">
</head>

<body class="login-body">

    <!-- Fondo 3D animado -->
    <div id="vanta-bg"></div>

    <div class="login-wrapper">
        <div class="card login-card tilt">
            <div class="card-body p-5">

                <div class="text-center mb-4">
                    <div class="login-logo">✂️</div>
                    <h3 class="mb-0">Peluqueria Mary</h3>
                    <p class="text-muted">Sistema de Logistica</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="usuario" class="form-control" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Contrasena</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
    <script>
        if (window.VANTA) {
            VANTA.NET({
                el: '#vanta-bg',
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                color: 0x42a5f5,
                backgroundColor: 0x0d47a1,
                points: 12.0,
                maxDistance: 22.0,
                spacing: 15.0
            });
        }
        VanillaTilt.init(document.querySelectorAll('.tilt'), {
            max: 6,
            speed: 400,
            glare: true,
            'max-glare': 0.15
        });
    </script>

</body>

</html>
